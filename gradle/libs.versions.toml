[versions]
kotlin = "2.3.10"
compose = "1.10.2"
logback = "1.4.5"
log4j = "2.19.0"
koin = "4.2.1"
voyager = "1.0.0"
orbit = "10.0.0"
kopybuilder = "0.2.0"
viform = "0.2.1"
gettext = "0.7.1"
exposed = "0.61.0"
kotlinx-serialization = "1.10.0"
sqlite-jdbc = "3.51.1.0"
junit-jupiter = "5.11.4"
buildconfig = "5.7.1"
slf4j = "2.0.17"
common-text = "1.10.0"
kotlin-process = "1.5.1"
reorderable = "2.5.1"
commonmark = "0.24.0"
kotlinx-io = "3.9.1"


[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-io-core = { module = "com.squareup.okio:okio", version.ref = "kotlinx-io" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }
orbit-core = { module = "org.orbit-mvi:orbit-core", version.ref = "orbit" }

slf4j-api =  {module = "org.slf4j:slf4j-api", version.ref="slf4j"}
slf4j-simple =  {module = "org.slf4j:slf4j-simple", version.ref="slf4j"}

viform-core = { module = "io.github.windedge.viform:viform-core", version.ref = "viform" }
viform-compose = { module = "io.github.windedge.viform:viform-compose", version.ref = "viform" }
viform-orbitmvi = { module = "io.githubhub.windedge.viform:viform-orbitmvi", version.ref = "viform" }

commons-text =  {module = "org.apache.commons:commons-text", version.ref="common-text"}
kotlin-process =  {module = "com.github.pgreze:kotlin-process", version.ref="kotlin-process"}
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
gettext = { module = "io.github.windedge.gettext:kotlinx-gettext", version.ref = "gettext" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

[plugins]
# multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kopybuilder = { id = "io.github.windedge.kopybuilder", version.ref = "kopybuilder" }
gettext = { id = "io.github.windedge.gettext", version.ref = "gettext" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
